name: Build GameDNS ARMv7 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-24"

      # ---------- نصب Gradle به‌صورت دستی ----------
      - name: Install Gradle 8.7 manually
        run: |
          GRADLE_VERSION=8.7
          GRADLE_DIST=gradle-${GRADLE_VERSION}-bin.zip
          wget -q https://services.gradle.org/distributions/${GRADLE_DIST} -P /tmp
          unzip -q /tmp/${GRADLE_DIST} -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      # ---------- تولید Gradle wrapper ----------
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # ---------- ایجاد آیکون‌های پیش‌فرض (در صورت نبود) ----------
      - name: Generate placeholder launcher icons
        run: |
          RES_PATH="app/src/main/res/mipmap-hdpi"
          mkdir -p $RES_PATH
          # فقط در صورتی ایجاد کن که فایل وجود نداشته باشد
          if [ ! -f "$RES_PATH/ic_launcher.png" ]; then
            convert -size 48x48 xc:'#000000' "$RES_PATH/ic_launcher.png"
          fi
          if [ ! -f "$RES_PATH/ic_launcher_round.png" ]; then
            convert -size 48x48 xc:'#000000' "$RES_PATH/ic_launcher_round.png"
          fi

      # ---------- افزودن فیلتر ARMv7 به build.gradle ----------
      - name: Force armeabi-v7a ABI only
        run: |
          BUILD_FILE=$(grep -rl "defaultConfig {" --include="build.gradle" . | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle with defaultConfig found; skipping ABI filter."
          else
            echo "Applying ABI filter to: $BUILD_FILE"
            sed -i "/defaultConfig {/a \        ndk { abiFilters 'armeabi-v7a' }" "$BUILD_FILE"
          fi

      # ---------- بیلد پروژه ----------
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------- جمع‌آوری خروجی ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDNS-armv7-debug
          path: |
            **/build/outputs/apk/debug/*.apk
