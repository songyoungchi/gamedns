name: Build GameDNS ARMv7 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-24"

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Force armeabi-v7a ABI only
        run: |
          BUILD_FILE=$(grep -rl "defaultConfig {" --include="build.gradle" . | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle with defaultConfig found; skipping ABI filter."
          else
            echo "Applying ABI filter to: $BUILD_FILE"
            sed -i "/defaultConfig {/a \        ndk { abiFilters 'armeabi-v7a' }" "$BUILD_FILE"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDNS-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
